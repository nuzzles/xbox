[package]
name = "xbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "Unofficial Xbox Live authentication, gamertag/XUID resolution, and profile client for Rust."
repository = "https://github.com/nuzzles/xbox"
readme = "README.md"
keywords = ["xbox", "xbox-live", "xsts", "gaming", "auth"]
categories = ["api-bindings", "authentication"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["legacy-password-login"]
legacy-password-login = ["regex"]

[dependencies]
reqwest = { version = "0.13.4", features = ["json", "cookies", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "rt"] }
chrono = { version = "0.4.45", features = ["serde"] }
async-trait = "0.1.91"
dashmap = "6.2.1"
regex = { version = "1.13.1", optional = true }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
wiremock = "0.6.5"
rpassword = "7.5.4"
